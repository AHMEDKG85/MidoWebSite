services:
  mido-website:
    build: .
    image: mido-website:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/mido.sqlite
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - mido-data:/app/data
      - mido-uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  mido-data:
  mido-uploads:
